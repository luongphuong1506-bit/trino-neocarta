# Stack test tích hợp metadata + lineage Trino -> Neo4j
# Cấu hình tối thiểu cho máy yếu (tổng giới hạn ~2.3GB RAM)

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=64MB
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d shop"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  trino:
    image: trinodb/trino:latest
    container_name: trino
    # tạo thư mục warehouse cho Iceberg (local file system) trước khi start Trino
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/trino/warehouse && exec /usr/lib/trino/bin/run-trino"]
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - trino_data:/data/trino   # chứa warehouse Iceberg (local file system)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1300M

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 64m
      NEO4J_db_tx__log_rotation_retention__policy: 1 files
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

volumes:
  pg_data:
  neo4j_data:
  trino_data:
