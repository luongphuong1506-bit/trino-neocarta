connector.name=iceberg

# Iceberg JDBC catalog: metadata bảng Iceberg lưu trong Postgres (không cần Hive Metastore / REST catalog)
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=demo
iceberg.jdbc-catalog.connection-password=demo
iceberg.jdbc-catalog.default-warehouse-dir=local:///

# File dữ liệu/metadata Iceberg lưu trên ổ local của container (chỉ dùng cho test, không cần MinIO/S3)
fs.local.enabled=true
local.location=/data/trino/warehouse

iceberg.file-format=PARQUET
